

<div>
    <h2>
        Angular Crud 2with Json Server
    </h2>

    <table>
       <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>userName</th>
            <th>Email</th>
        </tr>
       </thead>
       <tbody>
        <tr *ngFor="let data of apiData">
            <td>
                {{data.id}}
            </td>
            <td>
                {{data.name}}
            </td>
            <td>
                {{data.userName}}
            </td>
            <td>
                {{data.email}}
            </td>
        </tr>
       </tbody>
    </table>

</div>
