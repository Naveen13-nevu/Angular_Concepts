<div class="container mt-4">

  <h2>Angular CRUD</h2>


  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>User Name</th>
        <th>Email</th>
        <th>Update</th>
        <th>View</th>
        <th>Delete</th>
      </tr>
    </thead>

    <tbody>

      @for (data of apiData; track data.id) {

        <tr>
          <td>{{ data.id }}</td>
          <td>{{ data.name }}</td>
          <td>{{ data.userName }}</td>
          <td>{{ data.email }}</td>

          <td>
            <button
              class="btn btn-warning btn-sm"
              (click)="onUpdate(data.id)">
              Update
            </button>
          </td>

          <td>
            <button class="btn btn-secondary btn-sm">
              View
            </button>
          </td>

          <td>
            <button class="btn btn-danger btn-sm">
              Delete
            </button>
          </td>
        </tr>

      }

    </tbody>

  </table>

  <button
    class="btn btn-primary mt-3"
    (click)="addNewUser()">
    Add New User
  </button>

</div>
